name: App486
options:
  bundleIdPrefix: com.ahmad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  App486:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: "486"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "486 records your voice debrief after each doctor visit."
        NSSpeechRecognitionUsageDescription: "486 turns your voice debrief into text so you can search it later."
        NSLocationWhenInUseUsageDescription: "486 uses your location to detect which hospital you are at and to show you on the map."
        NSFaceIDUsageDescription: "486 uses Face ID to keep your doctor notes private."
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - whatsapp
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: App486
        PRODUCT_MODULE_NAME: App486
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmad.app486
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  App486:
    build:
      targets:
        App486: all
    run:
      config: Debug
    archive:
      config: Release
